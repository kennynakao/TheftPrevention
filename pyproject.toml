[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theftprevention"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.4", "opencv-python==5.0.0.93"]

[project.optional-dependencies]
demo = ["fastapi==0.162.4", "uvicorn==0.54.0", "python-multipart==0.0.33"]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["theftprevention*"]

[tool.setuptools.package-data]
theftprevention = ["static/*"]
